<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你适合生活在哪个城市？ | 海蓝蓝蓝</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf8f5;
  --card: #ffffff;
  --text: #2c2416;
  --sub: #6b5e4a;
  --accent: #c4733e;
  --accent2: #5b8c5a;
  --accent3: #4a7a9b;
  --accent4: #b8860b;
  --accent5: #9b59b6;
  --warm: #e8a87c;
  --soft: #f5ede0;
  --gold: #d4a559;
  --progress: linear-gradient(135deg, var(--accent2), var(--accent));
  --dim: rgba(0,0,0,0.04);
  --shadow: 0 2px 20px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.1);
  --radius: 18px;
  --radius-sm: 12px;
  --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', serif;
  --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

.app-container {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 0 16px 48px;
  min-height: 100vh;
  position: relative;
}

/* Progress Bar */
.progress-wrap {
  position: sticky;
  top: 0;
  z-index: 100;
  background: linear-gradient(180deg, var(--bg) 85%, transparent);
  padding: 16px 0 12px;
}
.progress-bar {
  height: 5px;
  background: #e8e3db;
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--progress);
  border-radius: 3px;
  transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
  width: 0%;
}
.progress-text {
  font-size: 12px;
  color: var(--sub);
  text-align: right;
  margin-top: 6px;
  font-weight: 500;
}

/* Screens */
.screen { display: none; animation: fadeIn 0.4s ease; }
.screen.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.02); }
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes wave {
  0%,100% { transform: translateY(0); }
  25% { transform: translateY(-4px); }
  75% { transform: translateY(4px); }
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 32px;
  border: none;
  border-radius: 50px;
  font-size: 16px;
  font-family: var(--font-sans);
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  letter-spacing: 0.5px;
  -webkit-user-select: none;
  user-select: none;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), #d4844e);
  color: #fff;
  box-shadow: 0 4px 20px rgba(196,115,62,0.3);
}
.btn-primary:active {
  transform: scale(0.97);
  box-shadow: 0 2px 10px rgba(196,115,62,0.3);
}
.btn-secondary {
  background: var(--card);
  color: var(--accent);
  border: 2px solid var(--accent);
}
.btn-secondary:active {
  background: var(--accent);
  color: #fff;
}
.btn-ghost {
  background: transparent;
  color: var(--sub);
  padding: 10px 20px;
}
.btn-sm {
  padding: 10px 22px;
  font-size: 14px;
}
.btn-block {
  width: 100%;
}

/* ========== HOME PAGE ========== */
.home-page {
  padding-top: 40px;
  text-align: center;
}
.home-hero {
  position: relative;
  margin-bottom: 32px;
}
.home-visual {
  font-size: 88px;
  margin-bottom: 16px;
  animation: float 4s ease-in-out infinite;
  filter: drop-shadow(0 8px 24px rgba(196,115,62,0.15));
}
.home-title {
  font-family: var(--font-serif);
  font-size: 36px;
  font-weight: 900;
  color: var(--text);
  margin-bottom: 12px;
  letter-spacing: 3px;
  line-height: 1.3;
}
.home-subtitle {
  font-size: 15px;
  color: var(--sub);
  line-height: 1.8;
  margin-bottom: 28px;
  padding: 0 12px;
}
.home-meta {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 36px;
  flex-wrap: wrap;
}
.home-meta-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--sub);
  background: var(--card);
  padding: 8px 16px;
  border-radius: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.home-brand {
  position: absolute;
  bottom: -20px;
  right: 0;
  font-size: 12px;
  color: var(--sub);
  opacity: 0.7;
  font-style: italic;
}
.home-disclaimer {
  font-size: 12px;
  color: var(--sub);
  opacity: 0.7;
  margin-top: 24px;
  padding: 0 24px;
  line-height: 1.6;
}

/* City decoration cards */
.city-preview {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 28px;
}
.city-preview-item {
  aspect-ratio: 1;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  background: var(--card);
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  animation: wave 2s ease-in-out infinite;
}
.city-preview-item:nth-child(2) { animation-delay: 0.2s; }
.city-preview-item:nth-child(3) { animation-delay: 0.4s; }
.city-preview-item:nth-child(4) { animation-delay: 0.6s; }

/* ========== SUPPORT PAGE ========== */
.support-page {
  padding-top: 24px;
}
.support-header {
  text-align: center;
  margin-bottom: 28px;
}
.support-header h2 {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
}
.support-header p {
  font-size: 14px;
  color: var(--sub);
}
.support-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.support-card h3 {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.support-card p, .support-card li {
  font-size: 14px;
  color: var(--text);
  line-height: 1.8;
}
.support-card ul {
  padding-left: 18px;
}
.support-card li {
  margin-bottom: 4px;
}
.dimensions-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 8px;
}
.dim-tag {
  background: var(--soft);
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 13px;
}
.dim-tag strong {
  display: block;
  color: var(--accent);
  margin-bottom: 2px;
  font-size: 14px;
}
.dim-tag span {
  font-size: 11px;
  color: var(--sub);
  line-height: 1.5;
}
.support-note {
  background: linear-gradient(135deg, #fef9f3, #fdf3e8);
  border-left: 3px solid var(--accent);
  padding: 14px 16px;
  border-radius: 0 12px 12px 0;
  margin: 16px 0 24px;
  font-size: 13px;
  color: var(--sub);
  line-height: 1.7;
}

/* ========== QUIZ PAGE ========== */
.quiz-page {
  padding-top: 4px;
}
.question-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px 22px;
  box-shadow: var(--shadow);
}
.question-scene {
  font-size: 13px;
  color: var(--accent);
  font-weight: 500;
  margin-bottom: 8px;
  opacity: 0.8;
}
.question-num {
  font-size: 12px;
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 10px;
  text-transform: uppercase;
}
.question-text {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 28px;
  line-height: 1.6;
  color: var(--text);
}
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 16px 18px;
  background: var(--dim);
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 15px;
  text-align: left;
  line-height: 1.6;
}
.option:active {
  transform: scale(0.98);
}
.option.selected {
  background: #fdf3e8;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(196,115,62,0.1);
}
.option-letter {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: #e8e3db;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  color: var(--sub);
  flex-shrink: 0;
  transition: all 0.2s ease;
  margin-top: 1px;
}
.option.selected .option-letter {
  background: var(--accent);
  color: #fff;
}
.quiz-actions {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
  gap: 12px;
}

/* ========== CALCULATING ========== */
.calc-page {
  text-align: center;
  padding-top: 100px;
}
.calc-anim {
  font-size: 64px;
  margin-bottom: 24px;
  animation: spin 2s linear infinite;
}
.calc-text {
  font-size: 18px;
  color: var(--sub);
  font-family: var(--font-serif);
}
.calc-sub {
  font-size: 13px;
  color: var(--sub);
  opacity: 0.7;
  margin-top: 12px;
}

/* ========== REPORT PAGE ========== */
.report-page {
  padding-bottom: 40px;
}
.report-hero {
  text-align: center;
  padding: 32px 0 24px;
  position: relative;
}
.lanlan-char {
  width: 100px;
  height: 100px;
  margin: 0 auto 12px;
  animation: float 4s ease-in-out infinite;
}
.city-emoji {
  font-size: 80px;
  margin-bottom: 8px;
  filter: drop-shadow(0 8px 24px rgba(0,0,0,0.1));
}
.city-name {
  font-family: var(--font-serif);
  font-size: 44px;
  font-weight: 900;
  letter-spacing: 6px;
  margin-bottom: 6px;
}
.city-tagline {
  font-size: 17px;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 16px;
}
.city-golden {
  display: inline-block;
  background: linear-gradient(135deg, #fef3e0, #fdebd0);
  border: 1px solid #e0c898;
  border-radius: 24px;
  padding: 10px 24px;
  font-size: 14px;
  color: var(--gold);
  font-weight: 600;
  font-style: italic;
  letter-spacing: 1px;
  font-family: var(--font-serif);
}
.city-shareline {
  margin-top: 16px;
  font-size: 14px;
  color: var(--sub);
  padding: 0 20px;
}
.city-shareline span {
  background: var(--soft);
  padding: 2px 10px;
  border-radius: 4px;
  font-weight: 500;
}

.report-section {
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.report-section h3 {
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.report-section h3 .section-icon {
  font-size: 20px;
}
.report-section p {
  font-size: 15px;
  color: var(--text);
  line-height: 1.9;
  margin-bottom: 12px;
}
.report-section p:last-child { margin-bottom: 0; }

.keyword-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}
.keyword-tag {
  background: linear-gradient(135deg, var(--soft), #faf0e4);
  color: var(--accent);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
}

/* Radar Chart */
.radar-container {
  text-align: center;
  padding: 8px 0;
}
.radar-container svg { max-width: 100%; height: auto; }
.radar-legend {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 8px;
  font-size: 12px;
  color: var(--sub);
}
.radar-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.radar-legend-line {
  width: 24px;
  height: 3px;
  border-radius: 2px;
}

/* Dimension bars */
.dim-bar-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.dim-bar-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.dim-bar-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}
.dim-bar-name {
  font-weight: 700;
  color: var(--text);
}
.dim-bar-score {
  font-weight: 700;
  color: var(--accent);
}
.dim-bar-track {
  height: 8px;
  background: #e8e3db;
  border-radius: 4px;
  overflow: hidden;
}
.dim-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 1s ease;
}
.dim-bar-desc {
  font-size: 12px;
  color: var(--sub);
}

/* Balance card */
.balance-card {
  background: linear-gradient(135deg, #fef9f3, #f8f4ee);
  border-radius: var(--radius-sm);
  padding: 18px;
  margin-top: 12px;
}
.balance-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;
  align-items: center;
  margin-bottom: 12px;
}
.balance-row:last-child { margin-bottom: 0; }
.balance-side {
  font-size: 13px;
  line-height: 1.6;
}
.balance-side.strength { color: var(--accent2); }
.balance-side.blind { color: #c06a5a; }
.balance-divider {
  width: 1px;
  height: 40px;
  background: #e0dbd2;
  position: relative;
}
.balance-divider::after {
  content: '⇋';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: #f8f4ee;
  padding: 0 4px;
  color: var(--sub);
  font-size: 14px;
}

/* Action plan */
.action-day {
  display: flex;
  gap: 14px;
  margin-bottom: 14px;
  padding-bottom: 14px;
  border-bottom: 1px dashed #e8e3db;
}
.action-day:last-child {
  margin-bottom: 0;
  padding-bottom: 0;
  border-bottom: none;
}
.action-day-num {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
}
.action-day-content h4 {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 4px;
}
.action-day-content p {
  font-size: 13px;
  color: var(--sub);
  line-height: 1.7;
  margin: 0;
}

.signal-list, .blind-list, .action-list {
  padding-left: 18px;
  font-size: 14px;
  line-height: 1.9;
}
.signal-list li { margin-bottom: 4px; }

/* Secondary cities */
.secondary-cities {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}
.secondary-city {
  background: var(--soft);
  padding: 14px;
  border-radius: var(--radius-sm);
  text-align: center;
}
.secondary-city-emoji {
  font-size: 32px;
  margin-bottom: 4px;
}
.secondary-city-name {
  font-weight: 700;
  font-size: 15px;
  margin-bottom: 2px;
}
.secondary-city-tag {
  font-size: 11px;
  color: var(--sub);
}
.secondary-city-pct {
  font-size: 12px;
  color: var(--accent);
  font-weight: 600;
  margin-top: 4px;
}

.report-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 20px;
  padding-bottom: 12px;
}

/* ========== REWARD PAGE ========== */
.reward-page {
  padding-top: 32px;
  text-align: center;
}
.reward-icon {
  font-size: 72px;
  margin-bottom: 16px;
  animation: pulse 2s ease-in-out infinite;
}
.reward-title {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
}
.reward-sub {
  font-size: 14px;
  color: var(--sub);
  margin-bottom: 24px;
  padding: 0 12px;
  line-height: 1.7;
}
.reward-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  text-align: left;
}
.reward-card h3 {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--accent);
}
.reward-steps {
  list-style: none;
  counter-reset: step;
}
.reward-steps li {
  counter-increment: step;
  position: relative;
  padding-left: 32px;
  margin-bottom: 12px;
  font-size: 14px;
  line-height: 1.7;
}
.reward-steps li::before {
  content: counter(step);
  position: absolute;
  left: 0;
  top: 2px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
}
.wechat-card {
  background: linear-gradient(135deg, #f0f9f0, #e8f5e8);
  border: 2px solid var(--accent2);
  border-radius: var(--radius-sm);
  padding: 20px;
  text-align: center;
  margin: 16px 0;
}
.wechat-id {
  font-size: 24px;
  font-weight: 900;
  color: var(--accent2);
  font-family: var(--font-mono, monospace);
  letter-spacing: 2px;
  margin: 8px 0;
}
.wechat-note {
  font-size: 12px;
  color: var(--sub);
  margin-top: 8px;
}
.wechat-remark {
  background: #fff;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-top: 10px;
  font-weight: 500;
  border: 1px dashed var(--accent2);
}
.reward-skip {
  margin-top: 8px;
  margin-bottom: 20px;
}

/* ========== BLESSING PAGE ========== */
.blessing-page {
  padding-top: 24px;
  text-align: center;
}
.blessing-lanlan {
  width: 120px;
  height: 120px;
  margin: 0 auto 20px;
  animation: float 4s ease-in-out infinite;
}
.blessing-title {
  font-family: var(--font-serif);
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 20px;
}
.blessing-letter {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px 24px;
  box-shadow: var(--shadow-lg);
  text-align: left;
  margin-bottom: 24px;
  position: relative;
}
.blessing-letter::before {
  content: '"';
  position: absolute;
  top: 8px;
  left: 16px;
  font-size: 60px;
  color: var(--soft);
  font-family: var(--font-serif);
  line-height: 1;
}
.blessing-letter p {
  font-family: var(--font-serif);
  font-size: 15px;
  line-height: 2;
  color: var(--text);
  text-indent: 2em;
  margin-bottom: 12px;
}
.blessing-letter p:last-child { margin-bottom: 0; }
.blessing-signature {
  text-align: right;
  margin-top: 20px;
  font-style: italic;
  color: var(--sub);
  font-size: 14px;
}
.blessing-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text);
  color: #fff;
  padding: 12px 28px;
  border-radius: 50px;
  font-size: 14px;
  font-family: var(--font-sans);
  z-index: 999;
  opacity: 0;
  transition: all 0.3s ease;

// ==================== STATE ====================
const STORAGE_KEY_PREFIX = `assessment:${TOPIC.slug}:${TOPIC.version}`;
let state = {
  currentIndex: 0,
  answers: new Array(QUESTIONS.length).fill(-1),
  result: null,
  supportMode: 'prequiz'
};

// ==================== HELPERS ====================
function $(id) { return document.getElementById(id); }

function showScreen(name) {
  const screens = ['screenHome','screenSupport','screenQuiz','screenCalc','screenReport','screenReward','screenBlessing'];
  screens.forEach(s => $(s).classList.remove('active'));
  $(name).classList.add('active');
  $('progressWrap').style.display = (name === 'screenQuiz') ? 'block' : 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateProgress() {
  const answered = state.answers.filter(a => a >= 0).length;
  const pct = Math.round((answered / QUESTIONS.length) * 100);
  $('progressFill').style.width = pct + '%';
  $('progressText').textContent = `${answered} / ${QUESTIONS.length}`;
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function saveState() {
  localStorage.setItem(`${STORAGE_KEY_PREFIX}:answers`, JSON.stringify(state.answers));
  localStorage.setItem(`${STORAGE_KEY_PREFIX}:progress`, JSON.stringify({ currentIndex: state.currentIndex }));
  if (state.result) {
    localStorage.setItem(`${STORAGE_KEY_PREFIX}:result`, JSON.stringify(state.result));
  }
}

function loadState() {
  try {
    const answers = localStorage.getItem(`${STORAGE_KEY_PREFIX}:answers`);
    const progress = localStorage.getItem(`${STORAGE_KEY_PREFIX}:progress`);
    const result = localStorage.getItem(`${STORAGE_KEY_PREFIX}:result`);
    if (answers) state.answers = JSON.parse(answers);
    if (progress) {
      const p = JSON.parse(progress);
      state.currentIndex = p.currentIndex || 0;
    }
    if (result) state.result = JSON.parse(result);
  } catch(e) {}
}

function clearState() {
  localStorage.removeItem(`${STORAGE_KEY_PREFIX}:answers`);
  localStorage.removeItem(`${STORAGE_KEY_PREFIX}:progress`);
  localStorage.removeItem(`${STORAGE_KEY_PREFIX}:result`);
  state.answers = new Array(QUESTIONS.length).fill(-1);
  state.currentIndex = 0;
  state.result = null;
}

// ==================== QUIZ LOGIC ====================
function startQuiz() {
  if (state.result) {
    renderReport();
    showScreen('screenReport');
    return;
  }
  state.currentIndex = 0;
  state.answers = new Array(QUESTIONS.length).fill(-1);
  saveState();
  showScreen('screenQuiz');
  updateProgress();
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[state.currentIndex];
  const sel = state.answers[state.currentIndex];
  const letters = ['A','B','C','D'];

  let html = `<div class="question-scene">${q.scene}</div>`;
  html += `<div class="question-num">第 ${state.currentIndex + 1} 题 / 共 ${QUESTIONS.length} 题</div>`;
  html += `<div class="question-text">${q.q}</div>`;
  html += '<div class="options">';

  q.opts.forEach((opt, i) => {
    const selClass = (sel === i) ? ' selected' : '';
    html += `<div class="option option-enter${selClass}" onclick="selectOption(${i})">`;
    html += `<span class="option-letter">${letters[i]}</span>`;
    html += `<span>${opt.t}</span>`;
    html += '</div>';
  });

  html += '</div>';
  $('questionCard').innerHTML = html;

  $('btnPrev').style.visibility = (state.currentIndex > 0) ? 'visible' : 'hidden';
  const btnNext = $('btnNext');
  if (state.currentIndex === QUESTIONS.length - 1) {
    btnNext.textContent = sel >= 0 ? '查看结果 ✨' : '下一题 →';
    btnNext.className = sel >= 0 ? 'btn btn-primary btn-sm' : 'btn btn-secondary btn-sm';
  } else {
    btnNext.textContent = '下一题 →';
    btnNext.className = 'btn btn-secondary btn-sm';
  }
}

function selectOption(idx) {
  const prevIdx = state.answers[state.currentIndex];
  state.answers[state.currentIndex] = idx;
  saveState();
  updateProgress();
  renderQuestion();

  // Auto advance after short delay
  setTimeout(() => {
    if (state.answers[state.currentIndex] === idx) {
      if (state.currentIndex < QUESTIONS.length - 1) {
        state.currentIndex++;
        saveState();
        renderQuestion();
      }
    }
  }, 220);
}

function prevQuestion() {
  if (state.currentIndex > 0) {
    state.currentIndex--;
    saveState();
    renderQuestion();
  }
}

function nextQuestion() {
  if (state.answers[state.currentIndex] < 0) {
    showToast('请先选择一个选项');
    return;
  }

  if (state.currentIndex < QUESTIONS.length - 1) {
    state.currentIndex++;
    saveState();
    renderQuestion();
  } else {
    if (state.answers.some(a => a < 0)) {
      showToast('还有未完成的题目');
      return;
    }
    calculateAndShow();
  }
}

// ==================== SCORING ====================
function computeScores() {
  const raw = {};
  DIMENSIONS.forEach(d => raw[d.id] = 0);

  state.answers.forEach((ansIdx, qi) => {
    if (ansIdx < 0) return;
    const w = QUESTIONS[qi].opts[ansIdx].w;
    for (const [dim, val] of Object.entries(w)) {
      raw[dim] = (raw[dim] || 0) + val;
    }
  });

  // Normalize to 1-5 scale
  const normalized = {};
  const baseline = { pace: -3, social: 5, ambition: 0, nature: 6, modernity: 0, culture: 2 };
  const scale = { pace: 14, social: 16, ambition: 16, nature: 14, modernity: 14, culture: 12 };

  DIMENSIONS.forEach(d => {
    const centered = (raw[d.id] || 0) - baseline[d.id];
    const v = 3 + (centered / scale[d.id]) * 2;
    normalized[d.id] = Math.max(1, Math.min(5, v));
  });

  return { raw, normalized };
}

function findBestMatch(normalized) {
  const results = [];
  for (const [key, archetype] of Object.entries(ARCHETYPES)) {
    let dist = 0;
    DIMENSIONS.forEach(d => {
      dist += Math.pow((normalized[d.id] || 3) - archetype.vec[d.id], 2);
    });
    dist = Math.sqrt(dist);
    results.push({ key, archetype, dist });
  }
  results.sort((a, b) => a.dist - b.dist);
  return results;
}

function calculateAndShow() {
  showScreen('screenCalc');

  setTimeout(() => {
    const { raw, normalized } = computeScores();
    const matches = findBestMatch(normalized);
    const top = matches[0];
    const second = matches[1];
    const third = matches[2];

    // Calculate percentages (simplified: based on distance inverse)
    const totalDist = matches.slice(0, 3).reduce((s, m) => s + 1/(m.dist + 0.5), 0);
    const pct1 = Math.round((1/(top.dist + 0.5)) / totalDist * 100);
    const pct2 = Math.round((1/(second.dist + 0.5)) / totalDist * 100);
    const pct3 = 100 - pct1 - pct2;

    state.result = {
      cityKey: top.key,
      normalized,
      percentages: { first: pct1, second: pct2, third: pct3 },
      secondKey: second.key,
      thirdKey: third.key,
      timestamp: Date.now()
    };
    saveState();
    renderReport();
    showScreen('screenReport');
  }, 1800);
}

// ==================== RADAR CHART ====================
function generateRadarSVG(userVec, cityVec, cityColor) {
  const cx = 150, cy = 160, r = 110;
  const n = DIMENSIONS.length;
  const angleStep = (2 * Math.PI) / n;
  const startAngle = -Math.PI / 2;

  function polar(angle, radius) {
    return { x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle) };
  }
  function getPoints(vec) {
    return DIMENSIONS.map((d, i) => {
      const angle = startAngle + i * angleStep;
      const val = vec[d.id] || 3;
      const radius = (val / 5) * r;
      return polar(angle, radius);
    });
  }

  let svg = '';
  // Grid
  for (let level = 1; level <= 5; level++) {
    const lr = (level / 5) * r;
    svg += `<circle cx="${cx}" cy="${cy}" r="${lr}" fill="none" stroke="#e0dbd2" stroke-width="0.5"/>`;
  }
  // Axes
  for (let i = 0; i < n; i++) {
    const angle = startAngle + i * angleStep;
    const outer = polar(angle, r);
    svg += `<line x1="${cx}" y1="${cy}" x2="${outer.x}" y2="${outer.y}" stroke="#e0dbd2" stroke-width="0.5"/>`;
  }
  // Label backgrounds
  for (let i = 0; i < n; i++) {
    const angle = startAngle + i * angleStep;
    const lp = polar(angle, r + 26);
    svg += `<rect x="${lp.x - 22}" y="${lp.y - 10}" width="44" height="20" rx="4" fill="#faf8f5" opacity="0.9"/>`;
  }
  // Labels
  for (let i = 0; i < n; i++) {
    const angle = startAngle + i * angleStep;
    const lp = polar(angle, r + 26);
    svg += `<text x="${lp.x}" y="${lp.y + 5}" text-anchor="middle" font-size="12" font-family="'Noto Sans SC', sans-serif" fill="#6b5e4a" font-weight="600">${DIMENSIONS[i].name}</text>`;
  }
  // City area (dashed)
  const cityPts = getPoints(cityVec);
  svg += `<polygon points="${cityPts.map(p => `${p.x},${p.y}`).join(' ')}" fill="${cityColor}" fill-opacity="0.1" stroke="${cityColor}" stroke-width="1.5" stroke-dasharray="5,3"/>`;
  cityPts.forEach(p => {
    svg += `<circle cx="${p.x}" cy="${p.y}" r="3" fill="${cityColor}" opacity="0.5"/>`;
  });
  // User area
  const userPts = getPoints(userVec);
  svg += `<polygon points="${userPts.map(p => `${p.x},${p.y}`).join(' ')}" fill="${cityColor}" fill-opacity="0.25" stroke="${cityColor}" stroke-width="2.5" stroke-linejoin="round"/>`;
  userPts.forEach(p => {
    svg += `<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#fff" stroke="${cityColor}" stroke-width="2.5"/>`;
  });
  // Score labels
  for (let i = 0; i < n; i++) {
    const angle = startAngle + i * angleStep;
    const val = userVec[DIMENSIONS[i].id] || 3;
    const vp = polar(angle, (val/5)*r + 16);
    svg += `<text x="${vp.x}" y="${vp.y + 4}" text-anchor="middle" font-size="10" font-family="'Noto Sans SC', sans-serif" fill="${cityColor}" font-weight="700">${val.toFixed(1)}</text>`;
  }

  return `<svg viewBox="0 0 300 340" width="300" height="340" xmlns="http://www.w3.org/2000/svg">${svg}</svg>`;
}

  html += `
    <div class="report-section" style="background: linear-gradient(135deg, ${city.color}0d, ${city.color}15); border: 1px solid ${city.color}30;">
      <h3><span class="section-icon">💌</span>写在最后</h3>
      <p>城市没有高低之分，只有适合与不适合。有人在超一线城市如鱼得水，有人在小城小镇怡然自得——重要的不是别人怎么看，而是你自己过得开不开心、舒不舒服、有没有活成你想要的样子。</p>
      <p>这份报告不是为了给你贴标签，而是帮你看见：你内心真正渴望的是什么样的生活。愿你不管最终选择在哪里，都能把日子过成你喜欢的样子。</p>
    </div>
  `;

  // Actions
  html += `
    <div class="report-actions">
      <button class="btn btn-primary btn-sm" onclick="copyReport()">📋 复制完整报告</button>
      <button class="btn btn-secondary btn-sm" onclick="goToReward()">🎁 领取专属福利</button>
    </div>
    <div class="report-actions">
      <button class="btn btn-ghost btn-sm" onclick="retakeQuiz()">🔄 重新测评</button>
      <button class="btn btn-ghost btn-sm" onclick="goToBlessing()">💌 查看祝福</button>
    </div>
  `;

  $('reportContent').innerHTML = html;
}

  const text = `【你适合生活在哪个城市？】测评结果

${city.emoji} ${city.name} · ${city.tagline}

📌 分享：${city.shareLine}

🔍 你的画像
${city.profile}

🏷️ 关键词：${city.keywords.join('、')}

🔍 生活中你可能是这样的：
${city.signals.map((s,i)=>`${i+1}. ${s}`).join('\n')}

${city.balance.map(b=>`✨ ${b.s}\n🌫️ ${b.b}`).join('\n\n')}

    showToast('复制失败，请手动选择');

}

// ==================== BLESSING PAGE ====================
function renderBlessing() {
  if (!state.result) {
    showScreen('screenHome');
    return;
  }
  const city = ARCHETYPES[state.result.cityKey];

  const letter = `亲爱的你：

很高兴陪你走完这趟小小的城市探索之旅。

当你选择了一道又一道题的答案时，你其实也在回答一个更大的问题：我想要什么样的生活？有人说，选择一座城市就是选择一种活法。这句话只对了一半——城市是土壤，但你才是那颗要发芽的种子。土壤再肥沃，如果你是仙人掌，你也不会喜欢热带雨林；环境再好，如果那不是你想要的节奏，你也不会快乐。

${city.blessing}

我知道你可能现在正站在某个十字路口——要不要去大城市闯一闯？要不要回家乡过安稳日子？要不要为了梦想换一座城市？这些问题没有标准答案。这份测评也不会告诉你"你必须去哪里"。它只是帮你更清楚地看见：你内心的声音是什么样的，你真正在意的是什么，什么样的环境会让你觉得"活着真好"。

不要急着做决定。好的决定往往不是"想"出来的，是"活"出来的。如果可以，去你心动的城市住一段时间，不是旅游那种住，是像当地人一样住一住——去菜市场买菜、坐早晚高峰的地铁、在小区楼下散步、和便利店的店员打招呼。城市适不适合你，你的身体会先知道。

也不要觉得"选择了一座城市就是一辈子"。人生很长，你可以在不同的阶段住在不同的地方。二十岁在大城市奋斗，三十岁去小城慢下来，四十岁找个山清水秀的地方定居，都可以。人生不是一道单选题，是一篇可以不断修改的散文。

最后，不管你最终在哪里，愿你都有勇气追求你想要的生活，也有气度接纳生活给你的一切。愿你脚下有土地，身边有爱人，心里有光。

愿你在属于你的城市里，活得像你自己。

蓝蓝
陪你探索自己的朋友`;

  let html = `
    <div class="blessing-page">
      <div class="blessing-lanlan">${LANLAN_SVG}</div>
      <h2 class="blessing-title">给你的一封信 💌</h2>
      <div class="blessing-letter">
        ${letter.split('\n\n').map(p => `<p>${p.replace(/\n/g,'<br>')}</p>`).join('')}
        <div class="blessing-signature">—— 蓝蓝</div>
      </div>
      <div class="blessing-actions">
        <button class="btn btn-primary btn-sm" onclick="copyBlessing()">📋 复制祝福</button>
        <button class="btn btn-secondary btn-sm" onclick="showScreen('screenReport')">← 返回报告</button>
      </div>
      <div class="blessing-actions">
        <button class="btn btn-ghost btn-sm" onclick="retakeQuiz()">🔄 再测一次</button>
        <button class="btn btn-ghost btn-sm" onclick="showScreen('screenHome')">🏠 回到首页</button>
      </div>
      <p style="font-size:12px;color:var(--sub);opacity:0.6;margin-top:20px;">小红书：海蓝蓝蓝</p>
    </div>
  `;

  $('blessingContent').innerHTML = html;
  showScreen('screenBlessing');
}
